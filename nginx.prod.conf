# nginx.prod.conf
# Serves static assets and proxies /api to the backend service on Docker network

server {
    listen 80;
    server_name _;

    # increase client body size for large uploads
    client_max_body_size 50M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;

    # serve static files directly
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|ttf|woff|woff2|eot|json)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Proxy API requests to backend container
    # NOTE: use the compose service name 'backend' (as defined in docker-compose)
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (simple version)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback — serve index.html for non-file requests (so client-side routing works)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional health check route for nginx to check frontend availability
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # logging (can be tuned)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
