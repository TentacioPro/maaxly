services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: maaxly-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      # Listeners: internal (kafka:29092) for container-to-container, external (localhost:9092) for host
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Static KRaft cluster id (generated via `kafka-storage random-uuid`); fine for local dev
      CLUSTER_ID: AakMZjBLTOSYY5j8_VEj5w
      # Enable auto topic creation for local/dev
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: maaxly-kafka-ui
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_KRAFT_MODE=true
    depends_on:
      - kafka
    profiles:
      - dev

  redis:
    image: redis:7-alpine
    container_name: maaxly-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "verbose"]
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: maaxly-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    # UI available in both dev & prod
    profiles:
      - dev
      - prod

  # MongoDB for app data (dev/prod).
  mongodb:
    image: mongo:6.0
    container_name: maaxly-mongodb
    ports:
      - "27017:27017"  # expose for host access in dev (you can remove in real prod)
    environment:
      # Root user used only for initial setup / admin
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-maaxly}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-maaxlypass}
      # Default app DB name (same everywhere unless overridden via env file)
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-maaxly_prod_db}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL","mongosh --eval 'db.adminCommand({ping:1})' --quiet || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: ensure prod app user exists in MongoDB (idempotent)
  db-init:
    image: mongo:6.0
    container_name: maaxly-db-init
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGODB_APP_USER: ${MONGODB_APP_USER:-maaxly_prod_user}
      MONGODB_APP_PASS: ${MONGODB_APP_PASS:-maaxlypass}
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["bash","-lc"]
    command:
      - |
        echo "[db-init] Ensuring app user exists..." && \
        mongosh admin --host mongodb -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --eval "if (!db.getUser('${MONGODB_APP_USER}')) { db.createUser({user: '${MONGODB_APP_USER}', pwd: '${MONGODB_APP_PASS}', roles:[{role:'root', db:'admin'}]}); print('Created user ${MONGODB_APP_USER}'); } else { print('User ${MONGODB_APP_USER} already exists'); }" && \
        echo "[db-init] Completed."
    restart: "no"
    profiles:
      - prod

  # Mongo Express (UI)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: maaxly-mongo-express
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-maaxly}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-maaxlypass}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    # UI available in both dev & prod
    profiles:
      - dev
      - prod

  # Backend API (Node.js server) - now built from Dockerfile.backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: maaxly-backend
    environment:
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Internal host for Mongo (used if your code builds a URI from host/db)
      MONGODB_HOST: mongodb
      # Single source of truth for DB connection
      MONGODB_DB: ${MONGODB_DB:-maaxly_prod_db}
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - dev
      - prod

  # Frontend (Vite dev server)
  frontend:
    profiles:
      - dev
    image: node:20-alpine
    container_name: maaxly-frontend-dev
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:4000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # Production frontend: builds and serves static files using Nginx
  frontend-prod:
    profiles:
      - prod
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    container_name: maaxly-frontend-prod
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend

  # One-shot job: run seed scripts after DB is ready and user exists
  seed:
    image: node:20-alpine
    container_name: maaxly-seed
    working_dir: /app
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB}
      JWT_SECRET: ${JWT_SECRET}
    command: sh -lc "npm ci --omit=dev && node server/scripts/seed-docker.js || node server/scripts/seed.js"
    volumes:
      - ./:/app
    depends_on:
      mongodb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: "no"
    profiles:
      - prod

  # Nginx Proxy Manager for SSL and reverse proxy (prod)
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: maaxly-nginx-proxy-manager
    ports:
      - "${NPM_HTTP_PORT:-8088}:80"
      - "${NPM_ADMIN_PORT:-81}:81"   # admin UI
      - "${NPM_HTTPS_PORT:-8443}:443"
    environment:
      DISABLE_IPV6: "true"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
      - frontend-prod
    profiles:
      - prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # DuckDNS updater (prod)
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: maaxly-duckdns
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:-your-subdomain}
      - TOKEN=${DUCKDNS_TOKEN:-CHANGEME}
      - LOG_FILE=true
      - VERBOSITY=1
    volumes:
      - ./logs/duckdns:/config/log
    restart: unless-stopped
    profiles:
      - prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nightly backups of Kafka, Redis (volumes) and Mongo (mongodump)
  backup:
    image: mongo:6.0
    container_name: maaxly-backup
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-maaxly}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-maaxlypass}
      # Use the same DB name as the application
      MONGODB_DB: ${MONGODB_DB:-maaxly_prod_db}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./scripts/backup:/scripts:ro
      - kafka_data:/data/kafka:ro
      - redis_data:/data/redis:ro
      - backups:/backups
    command: ["bash","/scripts/backup.sh"]
    depends_on:
      - mongodb
      - redis
      - kafka
    profiles:
      - dev
      - prod

volumes:
  kafka_data:
    driver: local
  redis_data:
    driver: local
  redisinsight_data:
    driver: local
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  npm_data:
    driver: local
  npm_letsencrypt:
    driver: local
  backups:
    driver: local

  backend_node_modules:   # not used anymore, but safe to keep declared
    driver: local
  frontend_node_modules:
    driver: local

###
# Usage notes (env for server/scripts)
#
# You control dev vs prod via the env file you pass to docker compose:
#
#   DEV (.env.dev):
#     MONGO_INITDB_ROOT_USERNAME=maaxly
#     MONGO_INITDB_ROOT_PASSWORD=maaxlypass
#     MONGODB_DB=maaxly_dev_db
#     MONGODB_URI=mongodb://<app_user>:<pwd>@mongodb:27017/maaxly_dev_db?authSource=maaxly_dev_db
#
#   PROD (.env.prod):
#     MONGO_INITDB_ROOT_USERNAME=maaxly
#     MONGO_INITDB_ROOT_PASSWORD=maaxlypass
#     MONGODB_DB=maaxly_prod_db
#     MONGODB_URI=mongodb://maaxly_prod_user:maaxlypass@mongodb:27017/maaxly_prod_db?authSource=admin
#
# Suggested commands:
#   DEV:
#     docker compose -f docker-compose.kafka.yml --profile dev --env-file .env.dev up -d
#
#   PROD:
#     docker compose -f docker-compose.kafka.yml --profile prod --env-file .env.prod up -d
