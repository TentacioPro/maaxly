services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: maaxly-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      # Listeners: internal (kafka:29092) for container-to-container, external (localhost:9092) for host
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Static KRaft cluster id (generated via `kafka-storage random-uuid`); fine for local dev
      CLUSTER_ID: AakMZjBLTOSYY5j8_VEj5w
      # Enable auto topic creation for local/dev
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: maaxly-kafka-ui
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_KRAFT_MODE=true
    depends_on:
      - kafka
    profiles:
      - dev

  redis:
    image: redis:7-alpine
    container_name: maaxly-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "verbose"]
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: maaxly-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    profiles:
      - dev

  # MongoDB for app data (dev/prod). Credentials can be overridden via .env
  mongodb:
    image: mongo:6.0
    container_name: maaxly-mongodb
    ports:
      - "27017:27017"  # expose for host access in dev
    env_file:
      - .env.prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-maaxly}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-maaxlypass}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-mvp-db}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

  # Mongo Express (dev UI only)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: maaxly-mongo-express
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-maaxly}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-maaxlypass}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    profiles:
      - dev

  # Backend API (Node.js server)
  backend:
    image: node:20-alpine
    container_name: maaxly-backend
    working_dir: /app
    command: sh -lc "npm install --omit=dev && npm start"
    env_file:
      - .env.prod
    environment:
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Directly use the same variables as the mongodb service
      MONGODB_HOST: mongodb
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGODB_DB: ${MONGODB_DB}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
      - redis
      - kafka
    restart: unless-stopped
    profiles:
      - dev
      - prod

  # Frontend (Vite dev server OR production static server)
  frontend:
    # The 'dev' profile uses the Vite dev server with live reload
    profiles:
      - dev
    image: node:20-alpine
    container_name: maaxly-frontend-dev
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:4000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # Production frontend: builds and serves static files using Nginx
  frontend-prod:
    # The 'prod' profile builds a static site and serves it with Nginx
    profiles:
      - prod
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: maaxly-frontend-prod
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend


  # Nginx Proxy Manager for SSL and reverse proxy (prod)
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: maaxly-nginx-proxy-manager
    ports:
      - "${NPM_HTTP_PORT:-8088}:80"
      - "${NPM_ADMIN_PORT:-81}:81"   # admin UI
      - "${NPM_HTTPS_PORT:-8443}:443"
    environment:
      DISABLE_IPV6: "true"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    profiles:
      - prod

  # DuckDNS updater (prod)
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: maaxly-duckdns
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:-your-subdomain}
      - TOKEN=${DUCKDNS_TOKEN:-CHANGEME}
      - LOG_FILE=true
    restart: unless-stopped
    profiles:
      - prod

  # Nightly backups of Kafka, Redis (volumes) and Mongo (mongodump)
  backup:
    image: mongo:6.0
    container_name: maaxly-backup
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-maaxly}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-maaxlypass}
      MONGODB_DB: ${MONGODB_DB:-mvp-db}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: Etc/UTC
    volumes:
      - ./scripts/backup:/scripts:ro
      - kafka_data:/data/kafka:ro
      - redis_data:/data/redis:ro
      - backups:/backups
    command: ["bash","/scripts/backup.sh"]
    depends_on:
      - mongodb
      - redis
      - kafka
    profiles:
      - dev
      - prod

volumes:
  kafka_data:
    driver: local
  redis_data:
    driver: local
  redisinsight_data:
    driver: local
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  npm_data:
    driver: local
  npm_letsencrypt:
    driver: local
  backups:
    driver: local

  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local

###
# Usage notes (env for server/scripts)
# - Inside containers: use internal URI
#     MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-maaxly}:${MONGO_INITDB_ROOT_PASSWORD:-maaxlypass}@mongodb:27017/${MONGODB_DB:-mvp-db}?authSource=admin
# - From host (npm run server): use host-mapped URI
#     MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-maaxly}:${MONGO_INITDB_ROOT_PASSWORD:-maaxlypass}@localhost:27017/${MONGODB_DB:-mvp-db}?authSource=admin
# - For prod, set strong creds via .env and avoid starting dev-only profiles:
#     docker compose --profile prod up -d  (dev-only UIs are excluded)
# - Recommended: use explicit env files per profile
#     DEV:  docker compose -f docker-compose.kafka.yml --profile dev --env-file .env.dev up -d
#     PROD: docker compose -f docker-compose.kafka.yml --profile prod --env-file .env.prod up -d
